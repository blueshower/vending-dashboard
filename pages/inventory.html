<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>庫存預訂 — 販賣機管理</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .cache-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #166534;
      flex-wrap: wrap;
    }
    .cache-notice.stale {
      background: #fefce8;
      border-color: #fde68a;
      color: #92400e;
    }
    .cache-notice .go-dash {
      margin-left: auto;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .cache-notice .go-dash:hover { background: #1d4ed8; }
  </style>
</head>
<body>
<script src="../js/config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
let _inv = [], _ord = [], _meta = {}, _dev = "", _detail = false;

window.addEventListener("DOMContentLoaded", async () => {
  renderLayout("庫存預訂資訊", "inventory");
  document.getElementById("page-body").innerHTML = `<p style="padding:16px;color:#64748b">讀取快取中…</p>`;
  await loadFromCache();
});

async function loadFromCache() {
  showLoading(true);
  try {
    const cached = await readCacheFromSheet("cache_inventory");

    if (!cached || !cached.data) {
      showNoCacheMessage();
      return;
    }

    const { inventory, orders, updatedAt } = cached.data;
    _inv = inventory || [];
    _ord = orders || [];
    _meta = { updatedAt, isValid: isCacheValid(updatedAt) };
    renderInventory();

  } catch(e) {
    document.getElementById("page-body").innerHTML = `
      <div style="padding:24px">
        <p style="color:#dc2626;margin-bottom:12px">讀取快取失敗：${e.message}</p>
        <button class="btn-icon" onclick="location.href='dashboard.html'">← 返回 Dashboard 重新整理資料</button>
      </div>`;
  } finally { showLoading(false); }
}

function showNoCacheMessage() {
  document.getElementById("page-body").innerHTML = `
    <div style="padding:24px;text-align:center">
      <p style="font-size:32px;margin-bottom:8px">📭</p>
      <p style="color:#64748b;margin-bottom:16px;font-size:14px">
        尚無快取資料。<br/>請先到 Dashboard 載入一次資料。
      </p>
      <button class="btn-icon" onclick="location.href='dashboard.html'"
        style="background:#2563eb;color:#fff;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px">
        🏠 前往 Dashboard
      </button>
    </div>`;
}

// 設備快選切換
function onDeviceChange(v) {
  _dev = v;
  renderInventory();
}

// 貨道細項勾選切換
function onDetailChange(checked) {
  _detail = checked;
  renderInventory();
}

// 貨道排序：A1 < A2 < … < Z1 < AA1 < AB1
function _slotKey(s) {
  const m = /^([A-Za-z]+)(\d+)$/.exec(s);
  return m ? [m[1].length, m[1].toUpperCase(), parseInt(m[2], 10)] : [99, String(s), 0];
}
function _cmpSlot(a, b) {
  const x = _slotKey(a), y = _slotKey(b);
  if (x[0] !== y[0]) return x[0] - y[0];
  if (x[1] !== y[1]) return x[1] < y[1] ? -1 : 1;
  return x[2] - y[2];
}

function renderInventory() {
  const { updatedAt, isValid } = _meta;
  const inventory = _dev ? _inv.filter(i => i.code === _dev) : _inv;
  const orders = _ord;
  const deviceOpts = buildDeviceOptions(_inv, "code", "devName");

  const updatedLabel = updatedAt
    ? new Date(updatedAt).toLocaleString("zh-TW", { hour12:false })
    : "—";

  let theadHTML, rows, count, colspan, noSlotNotice = "";

  if (!_detail) {
    // ── 一般模式：依商品加總（原本的顯示）──
    const ordMap = {};
    orders.forEach(o => {
      if (o.finish === "False") {
        const key = `${o.name}__${o.commodityCode}`;
        ordMap[key] = (ordMap[key] || 0) + 1;
      }
    });

    theadHTML = `<tr>
      <th>#</th><th>設備編號</th><th>設備名稱</th><th>商品編號</th>
      <th>商品名稱</th><th>即時庫存</th><th>可售庫存</th><th>預訂數量</th><th>狀態</th>
    </tr>`;
    colspan = 9;
    count = inventory.length;

    rows = inventory.map((item, idx) => {
      const ord = ordMap[`${item.devName}__${item.commodityCode}`] || 0;
      const sl = item.sellable ?? 0;
      const badge = sl >= 1
        ? `<span class="badge badge-green">有貨</span>`
        : `<span class="badge badge-red">缺貨</span>`;
      return `<tr>
        <td>${idx + 1}</td>
        <td><code style="font-size:11px">${item.code}</code></td>
        <td><strong>${item.devName}</strong></td>
        <td>${item.commodityCode}</td>
        <td>${item.commodityName}</td>
        <td>${item.realtime !== "" ? item.realtime : "—"}</td>
        <td>${sl}</td>
        <td>${ord}</td>
        <td>${badge}</td>
      </tr>`;
    }).join("");

  } else {
    // ── 貨道細項模式：每個貨道一列 ──
    const hasSlotData = _inv.some(i => i.slots && Object.keys(i.slots).length);
    if (!hasSlotData) {
      noSlotNotice = `<div class="cache-notice stale">⚠️ 目前快取沒有貨道資料，請先到 Dashboard 按「重新整理」更新一次。</div>`;
    }

    const flat = [];
    inventory.forEach(item => {
      const entries = Object.entries(item.slots || {});
      if (entries.length === 0) {
        flat.push({ item, slot: "—", qty: item.realtime !== "" ? item.realtime : "—" });
      } else {
        entries.forEach(([slot, qty]) => flat.push({ item, slot, qty }));
      }
    });
    flat.sort((a, b) =>
      (a.item.devName || "").localeCompare(b.item.devName || "", "zh-TW") ||
      (a.item.code || "").localeCompare(b.item.code || "") ||
      _cmpSlot(a.slot, b.slot)
    );

    theadHTML = `<tr>
      <th>#</th><th>設備編號</th><th>設備名稱</th><th>貨道位置</th>
      <th>商品編號</th><th>商品名稱</th><th>即時庫存</th>
    </tr>`;
    colspan = 7;
    count = flat.length;

    rows = flat.map((r, idx) => `<tr>
      <td>${idx + 1}</td>
      <td><code style="font-size:11px">${r.item.code}</code></td>
      <td><strong>${r.item.devName}</strong></td>
      <td><strong>${r.slot}</strong></td>
      <td>${r.item.commodityCode}</td>
      <td>${r.item.commodityName}</td>
      <td>${r.qty}</td>
    </tr>`).join("");
  }

  document.getElementById("page-body").innerHTML = `
    <div class="${isValid ? "cache-notice" : "cache-notice stale"}">
      <span>${isValid ? "✅ 快取有效" : `⚠️ 快取已超過 ${CONFIG.CACHE_TTL_MINUTES} 分鐘`}</span>
      <span style="font-weight:600">最後更新：${updatedLabel}</span>
      <button class="go-dash" onclick="location.href='dashboard.html'">
        🔄 前往 Dashboard 重新整理
      </button>
    </div>
    ${noSlotNotice}
    <div style="margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      ${deviceFilterHTML(deviceOpts, _dev, "onDeviceChange")}
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#334155;cursor:pointer">
        <input type="checkbox" ${_detail ? "checked" : ""} onchange="onDetailChange(this.checked)" />
        貨道細項
      </label>
      <span style="color:#64748b;font-size:13px">共 ${count} 筆${_detail ? "貨道" : "商品"}</span>
    </div>
    <div class="table-wrap">
      <div class="table-header">
        <h2>${_detail ? "貨道庫存列表" : "庫存預訂列表"}（${count} 筆${_detail ? "貨道" : "商品"}）</h2>
      </div>
      <table>
        <thead>${theadHTML}</thead>
        <tbody>${rows || `<tr><td colspan='${colspan}' style='text-align:center;color:#64748b'>無資料</td></tr>`}</tbody>
      </table>
    </div>`;
}
</script>
</body>
</html>
